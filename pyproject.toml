[project]
name = "apipy"
version = "0.1.0"
description = "FastAPI project"
requires-python = ">=3.10"

dependencies = [
    "fastapi~=0.111.0",
    "uvicorn==0.30.1",
    "pydantic==2.7.1",
    "PyJWT==2.9.0",
    "passlib[argon2,bcrypt]==1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "black==24.4.2",
    "ruff==0.4.4",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
