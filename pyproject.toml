[project]
name = "apipy"
version = "0.1.0"
description = "FastAPI project"
requires-python = ">=3.10"

dependencies = [
    "fastapi~=0.111.0",
    "uvicorn==0.30.1",
    "pydantic==2.7.1",
    "PyJWT[crypto]==2.9.0",
    "cryptography==42.0.7",
    "passlib[argon2,bcrypt]==1.7.4",
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "ruff==0.4.4",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "pytest-asyncio==0.23.7",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
