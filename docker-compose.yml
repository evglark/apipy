version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: apipy-db
    environment:
      POSTGRES_DB: apipy
      POSTGRES_USER: apipy
      POSTGRES_PASSWORD: apipy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apipy -d apipy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apipy-app
    environment:
      DATABASE_URL: postgresql://apipy:apipy@db:5432/apipy
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
